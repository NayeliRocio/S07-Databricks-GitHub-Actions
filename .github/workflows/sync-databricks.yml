name: Sync Databricks Git Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-git-folder-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync GitHub to Databricks
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_GIT_FOLDER_PATH: ${{ secrets.DATABRICKS_GIT_FOLDER_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required configuration
        shell: bash
        run: |
          missing=0
          for name in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_GIT_FOLDER_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Sync Databricks Git Folder
        shell: bash
        run: |
          databricks repos update "$DATABRICKS_GIT_FOLDER_PATH" --branch main
          databricks repos get "$DATABRICKS_GIT_FOLDER_PATH"
